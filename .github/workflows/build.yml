name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::Tag must look like v0.11.13 or v0.11.12.1 (got $GITHUB_REF_NAME)"
              exit 1
            fi
            echo "settings=MARKETING_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "settings=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          xcodebuild build \
            -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            "CODE_SIGN_IDENTITY[sdk=macosx*]=-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            ${{ steps.version.outputs.settings }}

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Ice.app Ice.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ice
          path: Ice.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Ice.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ice-zhtw ${{ steps.version.outputs.version }}" \
            --generate-notes
